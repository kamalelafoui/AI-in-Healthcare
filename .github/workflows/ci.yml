name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Vérification configuration et non-régression
        run: python main.py --check
      - name: Tests
        run: python -m pytest -q
      - name: Lot de test (Correlation ID sur chaque exécution)
        run: python main.py
      - name: Simulation d'incident (runbook)
        run: python scripts/simulate_incident.py

  docker:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        run: docker build -t ai-healthcare-agents .
      - name: Démarrage et test de santé
        run: |
          docker run -d --name hc -p 8001:8001 ai-healthcare-agents
          for i in $(seq 1 20); do curl -fs http://localhost:8001/api/health && break || sleep 2; done
          curl -fs http://localhost:8001/api/health
      - name: Journal en cas d'échec
        if: failure()
        run: docker logs hc
